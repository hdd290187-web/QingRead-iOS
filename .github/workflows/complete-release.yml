name: Complete iOS release
on:
  workflow_dispatch:
    inputs:
      regression_run:
        description: 'Completed main and iPhone 15 regression evidence'
        required: true
        default: '43411473924'
      benchmark_run:
        description: 'Successful calibrated same-device benchmark evidence'
        required: true
        default: '43418894170'
permissions:
  contents: read
  actions: read
concurrency:
  group: complete-release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify completed regression and performance evidence
        env:
          GH_TOKEN: ${{ github.token }}
          REGRESSION_RUN: ${{ inputs.regression_run }}
          BENCHMARK_RUN: ${{ inputs.benchmark_run }}
        run: |
          set -euo pipefail
          [[ "$REGRESSION_RUN" =~ ^[0-9]+$ && "$BENCHMARK_RUN" =~ ^[0-9]+$ ]]
          mkdir -p delivery
          gh run view "$REGRESSION_RUN" --repo hdd290187-web/QingRead-iOS --json databaseId,headSha,jobs,status,conclusion,url > delivery/regression-run.json
          gh run view "$BENCHMARK_RUN" --repo hdd290187-web/QingRead-iOS --json databaseId,headSha,jobs,status,conclusion,url > delivery/benchmark-run.json
          gh run download "$REGRESSION_RUN" --repo hdd290187-web/QingRead-iOS --name QingRead-ios-unsigned --dir "$RUNNER_TEMP/regression-proof"
          gh run download "$BENCHMARK_RUN" --repo hdd290187-web/QingRead-iOS --name Yuying-reader-benchmark --dir "$RUNNER_TEMP/benchmark-proof"
          python3 scripts/prepare-release-proof.py "$RUNNER_TEMP/regression-proof" "$RUNNER_TEMP/benchmark-proof" delivery
          printf 'regression_run=%s\nbenchmark_run=%s\n' "$REGRESSION_RUN" "$BENCHMARK_RUN" > delivery/evidence-runs.txt
      - name: Generate pinned project and build arm64 Release
        run: |
          set -euo pipefail
          { sw_vers; xcodebuild -version; swift --version; xcodebuild -showsdks; } > delivery/environment.txt
          curl -fsSL https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip -o "$RUNNER_TEMP/xcodegen.zip"
          printf '4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  %s\n' "$RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/generator"
          generator="$(find "$RUNNER_TEMP/generator" -type f -name xcodegen | head -1)"
          chmod +x "$generator"
          "$generator" generate
          mkdir -p QingRead.xcodeproj/project.xcworkspace/xcshareddata/swiftpm
          cp Package.resolved QingRead.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          xcodebuild -resolvePackageDependencies -onlyUsePackageVersionsFromResolvedFile -project QingRead.xcodeproj -scheme QingRead -clonedSourcePackagesDirPath "$RUNNER_TEMP/packages" 2>&1 | tee delivery/dependencies.log
          ditto -c -k QingRead.xcodeproj delivery/QingRead.xcodeproj.zip
          xcodebuild -project QingRead.xcodeproj -scheme QingRead -configuration Release -destination 'generic/platform=iOS' -sdk iphoneos -derivedDataPath "$RUNNER_TEMP/device" -clonedSourcePackagesDirPath "$RUNNER_TEMP/packages" ARCHS=arm64 CURRENT_PROJECT_VERSION=43 CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build 2>&1 | tee delivery/device-release.log
          app="$RUNNER_TEMP/device/Build/Products/Release-iphoneos/QingRead.app"
          test ! -e "$app/_CodeSignature/CodeResources"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")" = com.hdd290187.qingread
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$app/Info.plist")" = 予盈
          lipo -archs "$app/QingRead" | tee delivery/architectures.txt
          lipo -archs "$app/QingRead" | grep -qw arm64
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          ditto "$app" "$RUNNER_TEMP/ipa/Payload/QingRead.app"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$GITHUB_WORKSPACE/delivery/QingRead.ipa" Payload)
          unzip -t delivery/QingRead.ipa
          { printf 'brand=予盈\nbundle_id=com.hdd290187.qingread\nversion=1.0.0\nbuild=43\nminimum_ios=17.0\nsigning=unsigned\n'; printf 'commit=%s\nrun=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID"; xcodebuild -version; } > delivery/build-info.txt
          (cd delivery && shasum -a 256 QingRead.ipa > SHA256SUMS)
      - name: Verify large layouts on a fresh destination
        run: |
          set -euo pipefail
          xcrun simctl list devices available --json > delivery/available-simulators.json
          simulator_id="$(python3 scripts/select-large-simulator.py delivery/available-simulators.json)"
          printf 'large simulator=%s\n' "$simulator_id" > delivery/large-simulator.txt
          python3 scripts/boot-test-simulator.py "$simulator_id" --shutdown-others
          xcrun simctl io "$simulator_id" recordVideo --codec=h264 delivery/large-layouts.mp4 &
          video_pid=$!
          trap 'kill -INT "$video_pid" 2>/dev/null || true; wait "$video_pid" 2>/dev/null || true' EXIT
          xcodebuild -project QingRead.xcodeproj -scheme QingRead -configuration Debug -destination "id=$simulator_id" -derivedDataPath "$RUNNER_TEMP/layout-tests" -clonedSourcePackagesDirPath "$RUNNER_TEMP/packages" -resultBundlePath "$GITHUB_WORKSPACE/delivery/Reader-Large.xcresult" -parallel-testing-enabled NO -enableCodeCoverage NO -test-timeouts-enabled YES -default-test-execution-time-allowance 300 -maximum-test-execution-time-allowance 300 -retry-tests-on-failure -test-iterations 2 -only-testing:QingReadUITests/ReaderLayoutTests CODE_SIGNING_ALLOWED=NO test 2>&1 | tee delivery/reader-large.log
      - name: Export large layout evidence
        if: always()
        run: |
          if test -d delivery/Reader-Large.xcresult; then
            xcrun xcresulttool get test-results summary --path delivery/Reader-Large.xcresult > delivery/Reader-Large-summary.json
            xcrun xcresulttool export attachments --path delivery/Reader-Large.xcresult --output-path delivery/Reader-Large-screenshots
          fi
      - name: Upload release candidate and validation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: QingRead-ios-unsigned
          path: delivery/
          if-no-files-found: error
          retention-days: 30
