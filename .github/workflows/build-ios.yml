name: Build iOS
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
      - name: Inspect actual Xcode and SDKs
        run: |
          set -euo pipefail
          mkdir -p delivery
          { sw_vers; xcodebuild -version; swift --version; xcodebuild -showsdks; } | tee delivery/environment.txt
      - name: Generate project
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip -o "$RUNNER_TEMP/xcodegen.zip"
          printf '4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  %s\n' "$RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/generator"
          generator="$(find "$RUNNER_TEMP/generator" -type f -name xcodegen | head -1)"
          chmod +x "$generator"
          "$generator" generate
          mkdir -p QingRead.xcodeproj/project.xcworkspace/xcshareddata/swiftpm
          cp Package.resolved QingRead.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          xcodebuild -resolvePackageDependencies -onlyUsePackageVersionsFromResolvedFile -project QingRead.xcodeproj -scheme QingRead -clonedSourcePackagesDirPath "$RUNNER_TEMP/packages" 2>&1 | tee delivery/dependencies.log
          cp QingRead.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved delivery/
          ditto -c -k QingRead.xcodeproj delivery/QingRead.xcodeproj.zip
      - name: Device Release build
        run: |
          set -euo pipefail
          xcodebuild -project QingRead.xcodeproj -scheme QingRead -configuration Release -destination 'generic/platform=iOS' -sdk iphoneos -derivedDataPath "$RUNNER_TEMP/device" -clonedSourcePackagesDirPath "$RUNNER_TEMP/packages" ARCHS=arm64 CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build 2>&1 | tee delivery/device-release.log
      - name: Run tests on iPhone Simulator
        run: |
          set -euo pipefail
          simulator_id="$(xcrun simctl list devices available --json | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(v["udid"] for a in d["devices"].values() for v in a if v.get("isAvailable") and v["name"].startswith("iPhone")))')"
          xcodebuild -project QingRead.xcodeproj -scheme QingRead -configuration Debug -destination "id=$simulator_id" -derivedDataPath "$RUNNER_TEMP/tests" -clonedSourcePackagesDirPath "$RUNNER_TEMP/packages" -resultBundlePath "$GITHUB_WORKSPACE/delivery/Tests.xcresult" CODE_SIGNING_ALLOWED=NO test 2>&1 | tee delivery/tests.log
      - name: Package unsigned arm64 IPA
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/device/Build/Products/Release-iphoneos/QingRead.app"
          test -f "$app/QingRead"
          test ! -e "$app/_CodeSignature/CodeResources"
          lipo -archs "$app/QingRead" | tee delivery/architectures.txt
          lipo -archs "$app/QingRead" | grep -qw arm64
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          ditto "$app" "$RUNNER_TEMP/ipa/Payload/QingRead.app"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$GITHUB_WORKSPACE/delivery/QingRead.ipa" Payload)
          unzip -t delivery/QingRead.ipa
          { printf 'version=1.0.0\nbuild=1\nminimum_ios=17.0\nsigning=unsigned\n'; printf 'commit=%s\nrun=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID"; xcodebuild -version; } > delivery/build-info.txt
          (cd delivery && shasum -a 256 QingRead.ipa > SHA256SUMS)
      - name: Upload build, logs and test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: QingRead-ios-unsigned
          path: delivery/
          if-no-files-found: error
          retention-days: 30
