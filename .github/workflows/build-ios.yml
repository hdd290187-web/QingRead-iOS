name: Build iOS
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      import_only:
        description: 'Only run document picker UI diagnostics; never package an IPA'
        type: boolean
        default: false
      reader_diagnostics:
        description: 'Run targeted reader failure regressions; never package an IPA'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Inspect actual Xcode and SDKs
        run: |
          set -euo pipefail
          mkdir -p delivery
          { sw_vers; xcodebuild -version; swift --version; xcodebuild -showsdks; } | tee delivery/environment.txt
      - name: Generate project
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip -o "$RUNNER_TEMP/xcodegen.zip"
          printf '4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  %s\n' "$RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/generator"
          generator="$(find "$RUNNER_TEMP/generator" -type f -name xcodegen | head -1)"
          chmod +x "$generator"
          printf 'XCODEGEN_BIN=%s\n' "$generator" >> "$GITHUB_ENV"
          "$generator" generate
          python3 scripts/configure-test-plan.py
          mkdir -p QingRead.xcodeproj/project.xcworkspace/xcshareddata/swiftpm
          cp Package.resolved QingRead.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          xcodebuild -resolvePackageDependencies -onlyUsePackageVersionsFromResolvedFile -project QingRead.xcodeproj -scheme QingRead -clonedSourcePackagesDirPath "$RUNNER_TEMP/packages" 2>&1 | tee delivery/dependencies.log
          cp QingRead.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved delivery/
          ditto -c -k QingRead.xcodeproj delivery/QingRead.xcodeproj.zip
          cp QingRead.xctestplan delivery/
          app_build="$(python3 -c 'import re; from pathlib import Path; print(re.search(r"CURRENT_PROJECT_VERSION: ([0-9]+)", Path("project.yml").read_text()).group(1))')"
          printf 'APP_BUILD=%s\n' "$app_build" >> "$GITHUB_ENV"
      - name: Device Release build
        if: ${{ !inputs.import_only && !inputs.reader_diagnostics }}
        run: |
          set -euo pipefail
          xcodebuild -project QingRead.xcodeproj -scheme QingRead -configuration Release -destination 'generic/platform=iOS' -sdk iphoneos -derivedDataPath "$RUNNER_TEMP/device" -clonedSourcePackagesDirPath "$RUNNER_TEMP/packages" ARCHS=arm64 CURRENT_PROJECT_VERSION="$APP_BUILD" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build 2>&1 | tee delivery/device-release.log
      - name: Run tests on iPhone Simulator
        env:
          IMPORT_ONLY: ${{ inputs.import_only || false }}
          READER_DIAGNOSTICS: ${{ inputs.reader_diagnostics || false }}
        run: |
          set -euo pipefail
          xcrun simctl list devices available --json > delivery/available-simulators.json
          simulator_id="$(python3 scripts/select-simulator.py delivery/available-simulators.json)"
          printf 'SIMULATOR_DEVICE_ID=%s\n' "$simulator_id" >> "$GITHUB_ENV"
          python3 scripts/boot-test-simulator.py "$simulator_id" --shutdown-others
          python3 scripts/stream-import-logs.py delivery/import-logs &
          monitor_pid=$!
          trap 'kill "$monitor_pid" 2>/dev/null || true; wait "$monitor_pid" 2>/dev/null || true' EXIT
          test_args=(-parallel-testing-enabled NO -test-timeouts-enabled YES -default-test-execution-time-allowance 600 -maximum-test-execution-time-allowance 900 -retry-tests-on-failure -test-iterations 2)
          if test "$IMPORT_ONLY" = true; then test_args+=(-only-testing:QingReadUITests/DocumentImportTests "SWIFT_ACTIVE_COMPILATION_CONDITIONS=DEBUG SYSTEM_FILES_DIAGNOSTICS"); fi
          if test "$READER_DIAGNOSTICS" = true; then
            test_args+=(-only-testing:QingReadTests/ScrollWindowTests -only-testing:QingReadTests/ReaderRepairTests -only-testing:QingReadTests/ReaderPerformanceTests -only-testing:QingReadTests/CoreTests/testFontAndTextKitCharacterAnchor -only-testing:QingReadUITests/ReaderLayoutTests/testChapterBoundaryFontChangeAndBackgroundRestore -only-testing:QingReadUITests/ReaderAcceptanceTests -only-testing:QingReadUITests/ReaderIntegrityTests/testShortBookEightyFastFlingReversalsAndReopen -only-testing:QingReadUITests/BrandUITests/testEPUBOriginalCoverReadingAndPreferences -only-testing:QingReadUITests/ReaderScrollPerformanceTests/testShortTXTRepeatedFlingAndRestore)
          fi
          xcodebuild -project QingRead.xcodeproj -scheme QingRead -testPlan QingRead -configuration Debug -destination "id=$simulator_id" -derivedDataPath "$RUNNER_TEMP/tests" -clonedSourcePackagesDirPath "$RUNNER_TEMP/packages" -resultBundlePath "$GITHUB_WORKSPACE/delivery/Tests.xcresult" "${test_args[@]}" CODE_SIGNING_ALLOWED=NO test 2>&1 | tee delivery/tests.log
          if test "$IMPORT_ONLY" != true && test "$READER_DIAGNOSTICS" != true; then python3 scripts/export-reader-performance.py "$simulator_id" delivery/performance-se optimized; fi
      - name: Export test screenshots and summary
        if: always()
        run: |
          if test -d delivery/Tests.xcresult; then
            xcrun xcresulttool get test-results summary --path delivery/Tests.xcresult > delivery/test-summary.json
            xcrun xcresulttool export attachments --path delivery/Tests.xcresult --output-path delivery/screenshots
          fi
          if test -d delivery/Brand-iPhone15.xcresult; then
            xcrun xcresulttool get test-results summary --path delivery/Brand-iPhone15.xcresult > delivery/brand-iphone15-summary.json
            xcrun xcresulttool export attachments --path delivery/Brand-iPhone15.xcresult --output-path delivery/brand-iphone15-screenshots
          fi
          for result in Baseline Reader-Large; do
            if test -d "delivery/$result.xcresult"; then
              xcrun xcresulttool get test-results summary --path "delivery/$result.xcresult" > "delivery/$result-summary.json"
              xcrun xcresulttool export attachments --path "delivery/$result.xcresult" --output-path "delivery/$result-screenshots"
            fi
          done
      - name: Package unsigned arm64 IPA
        if: ${{ !inputs.import_only && !inputs.reader_diagnostics }}
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/device/Build/Products/Release-iphoneos/QingRead.app"
          test -f "$app/QingRead"
          test ! -e "$app/_CodeSignature/CodeResources"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Info.plist")" = QingRead
          test -f "$app/NotoSerifSC.ttf"
          test -f "$app/Assets.car"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$app/Info.plist")" = 予盈
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")" = com.hdd290187.qingread
          test -d "$app/LaunchScreen.storyboardc"
          test "$APP_BUILD" -gt 43
          lipo -archs "$app/QingRead" | tee delivery/architectures.txt
          lipo -archs "$app/QingRead" | grep -qw arm64
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          ditto "$app" "$RUNNER_TEMP/ipa/Payload/QingRead.app"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$GITHUB_WORKSPACE/delivery/QingRead.ipa" Payload)
          unzip -t delivery/QingRead.ipa
          { printf 'brand=予盈\nbundle_id=com.hdd290187.qingread\nversion=1.0.0\nbuild=%s\nminimum_ios=17.0\nsigning=unsigned\n' "$APP_BUILD"; printf 'commit=%s\nrun=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID"; xcodebuild -version; } > delivery/build-info.txt
          (cd delivery && shasum -a 256 QingRead.ipa > SHA256SUMS)
      - name: Upload build, logs and test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: QingRead-ios-unsigned
          path: delivery/
          if-no-files-found: error
          retention-days: 30
  layouts:
    name: Layouts (${{ matrix.label }})
    if: ${{ !inputs.import_only && !inputs.reader_diagnostics }}
    runs-on: macos-15
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: iphone15
            summary: brand-iphone15-summary.json
            result: Brand-iPhone15
            screenshots: brand-iphone15-screenshots
            log: brand-iphone15.log
          - label: large
            summary: Reader-Large-summary.json
            result: Reader-Large
            screenshots: Reader-Large-screenshots
            log: reader-large.log
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare pinned project and dependencies
        run: |
          set -euo pipefail
          mkdir -p delivery
          { sw_vers; xcodebuild -version; } > delivery/layout-environment-${{ matrix.label }}.txt
          curl -fsSL https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip -o "$RUNNER_TEMP/xcodegen.zip"
          printf '4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  %s\n' "$RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/generator"
          generator="$(find "$RUNNER_TEMP/generator" -type f -name xcodegen | head -1)"
          chmod +x "$generator"
          "$generator" generate
          python3 scripts/configure-test-plan.py
          mkdir -p QingRead.xcodeproj/project.xcworkspace/xcshareddata/swiftpm
          cp Package.resolved QingRead.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          xcodebuild -resolvePackageDependencies -onlyUsePackageVersionsFromResolvedFile -project QingRead.xcodeproj -scheme QingRead -clonedSourcePackagesDirPath "$RUNNER_TEMP/packages" 2>&1 | tee delivery/layout-dependencies-${{ matrix.label }}.log
      - name: Verify actual reader and settings interactions
        run: |
          set -euo pipefail
          if test '${{ matrix.label }}' = iphone15; then
            simulator_id="$(python3 scripts/create-brand-simulator.py)"
          else
            xcrun simctl list devices available --json > "$RUNNER_TEMP/simulators.json"
            simulator_id="$(python3 scripts/select-large-simulator.py "$RUNNER_TEMP/simulators.json")"
          fi
          python3 scripts/boot-test-simulator.py "$simulator_id" --shutdown-others
          args=(-only-testing:QingReadUITests/ReaderLayoutTests -only-testing:QingReadUITests/ReaderAcceptanceTests)
          if test '${{ matrix.label }}' = iphone15; then args+=(-only-testing:QingReadUITests/BrandUITests -only-testing:QingReadUITests/ReaderScrollPerformanceTests); fi
          xcodebuild -project QingRead.xcodeproj -scheme QingRead -testPlan QingRead -configuration Debug -destination "id=$simulator_id" -derivedDataPath "$RUNNER_TEMP/tests" -clonedSourcePackagesDirPath "$RUNNER_TEMP/packages" -resultBundlePath "$GITHUB_WORKSPACE/delivery/${{ matrix.result }}.xcresult" -parallel-testing-enabled NO -enableCodeCoverage NO -test-timeouts-enabled YES -default-test-execution-time-allowance 600 -maximum-test-execution-time-allowance 900 -retry-tests-on-failure -test-iterations 2 "${args[@]}" CODE_SIGNING_ALLOWED=NO test 2>&1 | tee delivery/${{ matrix.log }}
          if test '${{ matrix.label }}' = iphone15; then python3 scripts/export-reader-performance.py "$simulator_id" delivery/performance-iphone15 optimized; fi
      - name: Export test results
        if: always()
        run: |
          if test -d delivery/${{ matrix.result }}.xcresult; then
            xcrun xcresulttool get test-results summary --path delivery/${{ matrix.result }}.xcresult > delivery/${{ matrix.summary }}
            xcrun xcresulttool get test-results tests --path delivery/${{ matrix.result }}.xcresult > delivery/${{ matrix.result }}-test-details.json
            xcrun xcresulttool export attachments --path delivery/${{ matrix.result }}.xcresult --output-path delivery/${{ matrix.screenshots }}
          fi
      - name: Upload device evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: QingRead-layout-${{ matrix.label }}
          path: delivery/
          if-no-files-found: error
          retention-days: 30
