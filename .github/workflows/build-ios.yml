name: Build iOS
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      import_only:
        description: 'Only run document picker UI diagnostics; never package an IPA'
        type: boolean
        default: false
      reader_diagnostics:
        description: 'Run targeted reader failure regressions; never package an IPA'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Inspect actual Xcode and SDKs
        run: |
          set -euo pipefail
          mkdir -p delivery
          { sw_vers; xcodebuild -version; swift --version; xcodebuild -showsdks; } | tee delivery/environment.txt
      - name: Generate project
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip -o "$RUNNER_TEMP/xcodegen.zip"
          printf '4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  %s\n' "$RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/generator"
          generator="$(find "$RUNNER_TEMP/generator" -type f -name xcodegen | head -1)"
          chmod +x "$generator"
          printf 'XCODEGEN_BIN=%s\n' "$generator" >> "$GITHUB_ENV"
          "$generator" generate
          mkdir -p QingRead.xcodeproj/project.xcworkspace/xcshareddata/swiftpm
          cp Package.resolved QingRead.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          xcodebuild -resolvePackageDependencies -onlyUsePackageVersionsFromResolvedFile -project QingRead.xcodeproj -scheme QingRead -clonedSourcePackagesDirPath "$RUNNER_TEMP/packages" 2>&1 | tee delivery/dependencies.log
          cp QingRead.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved delivery/
          ditto -c -k QingRead.xcodeproj delivery/QingRead.xcodeproj.zip
      - name: Device Release build
        if: ${{ !inputs.import_only && !inputs.reader_diagnostics }}
        run: |
          set -euo pipefail
          xcodebuild -project QingRead.xcodeproj -scheme QingRead -configuration Release -destination 'generic/platform=iOS' -sdk iphoneos -derivedDataPath "$RUNNER_TEMP/device" -clonedSourcePackagesDirPath "$RUNNER_TEMP/packages" ARCHS=arm64 CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build 2>&1 | tee delivery/device-release.log
      - name: Run tests on iPhone Simulator
        env:
          IMPORT_ONLY: ${{ inputs.import_only || false }}
          READER_DIAGNOSTICS: ${{ inputs.reader_diagnostics || false }}
        run: |
          set -euo pipefail
          xcrun simctl list devices available --json > delivery/available-simulators.json
          simulator_id="$(python3 scripts/select-simulator.py delivery/available-simulators.json)"
          printf 'SIMULATOR_DEVICE_ID=%s\n' "$simulator_id" >> "$GITHUB_ENV"
          python3 scripts/boot-test-simulator.py "$simulator_id"
          python3 scripts/stream-import-logs.py delivery/import-logs &
          monitor_pid=$!
          trap 'kill "$monitor_pid" 2>/dev/null || true; wait "$monitor_pid" 2>/dev/null || true' EXIT
          test_args=(-parallel-testing-enabled NO -retry-tests-on-failure -test-iterations 2)
          if test "$IMPORT_ONLY" = true; then test_args+=(-only-testing:QingReadUITests/DocumentImportTests "SWIFT_ACTIVE_COMPILATION_CONDITIONS=DEBUG SYSTEM_FILES_DIAGNOSTICS"); fi
          if test "$READER_DIAGNOSTICS" = true; then
            test_args+=(-only-testing:QingReadTests/ReaderPerformanceTests -only-testing:QingReadTests/CoreTests/testFontAndTextKitCharacterAnchor -only-testing:QingReadUITests/ReaderLayoutTests/testChapterBoundaryFontChangeAndBackgroundRestore -only-testing:QingReadUITests/BrandUITests/testEPUBOriginalCoverReadingAndPreferences -only-testing:QingReadUITests/ReaderScrollPerformanceTests/testShortTXTRepeatedFlingAndRestore)
          fi
          xcodebuild -project QingRead.xcodeproj -scheme QingRead -configuration Debug -destination "id=$simulator_id" -derivedDataPath "$RUNNER_TEMP/tests" -clonedSourcePackagesDirPath "$RUNNER_TEMP/packages" -resultBundlePath "$GITHUB_WORKSPACE/delivery/Tests.xcresult" "${test_args[@]}" CODE_SIGNING_ALLOWED=NO test 2>&1 | tee delivery/tests.log
          if test "$IMPORT_ONLY" != true && test "$READER_DIAGNOSTICS" != true; then python3 scripts/export-reader-performance.py "$simulator_id" delivery/performance-se optimized; fi
      - name: Brand layouts on iPhone 15
        if: ${{ !inputs.import_only && !inputs.reader_diagnostics }}
        run: |
          set -euo pipefail
          simulator_id="$(python3 scripts/create-brand-simulator.py)"
          printf 'BRAND_SIMULATOR_DEVICE_ID=%s\n' "$simulator_id" >> "$GITHUB_ENV"
          printf 'iPhone 15 simulator=%s\n' "$simulator_id" > delivery/brand-simulator.txt
          python3 scripts/boot-test-simulator.py "$simulator_id"
          xcrun simctl io "$simulator_id" recordVideo --codec=h264 delivery/scroll-optimized.mp4 &
          video_pid=$!
          trap 'kill -INT "$video_pid" 2>/dev/null || true; wait "$video_pid" 2>/dev/null || true' EXIT
          xcodebuild -project QingRead.xcodeproj -scheme QingRead -configuration Debug -destination "id=$simulator_id" -derivedDataPath "$RUNNER_TEMP/tests" -clonedSourcePackagesDirPath "$RUNNER_TEMP/packages" -resultBundlePath "$GITHUB_WORKSPACE/delivery/Brand-iPhone15.xcresult" -parallel-testing-enabled NO -retry-tests-on-failure -test-iterations 2 -only-testing:QingReadUITests/BrandUITests -only-testing:QingReadUITests/ReaderLayoutTests -only-testing:QingReadUITests/ReaderScrollPerformanceTests CODE_SIGNING_ALLOWED=NO test 2>&1 | tee delivery/brand-iphone15.log
          python3 scripts/export-reader-performance.py "$simulator_id" delivery/performance-iphone15 optimized
      - name: Baseline scrolling on the same iPhone 15
        if: ${{ !inputs.import_only && !inputs.reader_diagnostics }}
        run: |
          set -euo pipefail
          baseline_dir="$RUNNER_TEMP/reader-baseline"
          git worktree add --detach "$baseline_dir" d75d7b6b68f3dbf6a7e9b0dd8d012880732e0bf9
          python3 scripts/prepare-reader-baseline.py "$baseline_dir"
          (cd "$baseline_dir" && "$XCODEGEN_BIN" generate)
          mkdir -p "$baseline_dir/QingRead.xcodeproj/project.xcworkspace/xcshareddata/swiftpm"
          cp Package.resolved "$baseline_dir/QingRead.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved"
          xcrun simctl io "$BRAND_SIMULATOR_DEVICE_ID" recordVideo --codec=h264 delivery/scroll-baseline.mp4 &
          video_pid=$!
          trap 'kill -INT "$video_pid" 2>/dev/null || true; wait "$video_pid" 2>/dev/null || true' EXIT
          xcodebuild -project "$baseline_dir/QingRead.xcodeproj" -scheme QingRead -configuration Debug -destination "id=$BRAND_SIMULATOR_DEVICE_ID" -derivedDataPath "$RUNNER_TEMP/baseline-tests" -clonedSourcePackagesDirPath "$RUNNER_TEMP/packages" -resultBundlePath "$GITHUB_WORKSPACE/delivery/Baseline.xcresult" -parallel-testing-enabled NO -retry-tests-on-failure -test-iterations 2 -only-testing:QingReadUITests/ReaderScrollPerformanceTests CODE_SIGNING_ALLOWED=NO test 2>&1 | tee delivery/baseline-tests.log
          python3 scripts/export-reader-performance.py "$BRAND_SIMULATOR_DEVICE_ID" delivery/performance-baseline baseline
          python3 scripts/compare-reader-performance.py delivery/performance-baseline delivery/performance-iphone15 delivery/performance-comparison
      - name: Reader layouts on large iPhone
        if: ${{ !inputs.import_only && !inputs.reader_diagnostics }}
        run: |
          set -euo pipefail
          simulator_id="$(python3 scripts/create-brand-simulator.py 'iPhone 16 Pro Max')"
          printf 'iPhone 16 Pro Max simulator=%s\n' "$simulator_id" > delivery/large-simulator.txt
          python3 scripts/boot-test-simulator.py "$simulator_id"
          xcodebuild -project QingRead.xcodeproj -scheme QingRead -configuration Debug -destination "id=$simulator_id" -derivedDataPath "$RUNNER_TEMP/tests" -clonedSourcePackagesDirPath "$RUNNER_TEMP/packages" -resultBundlePath "$GITHUB_WORKSPACE/delivery/Reader-Large.xcresult" -parallel-testing-enabled NO -retry-tests-on-failure -test-iterations 2 -only-testing:QingReadUITests/ReaderLayoutTests CODE_SIGNING_ALLOWED=NO test 2>&1 | tee delivery/reader-large.log
      - name: Export test screenshots and summary
        if: always()
        run: |
          if test -d delivery/Tests.xcresult; then
            xcrun xcresulttool get test-results summary --path delivery/Tests.xcresult > delivery/test-summary.json
            xcrun xcresulttool export attachments --path delivery/Tests.xcresult --output-path delivery/screenshots
            if test '${{ job.status }}' != success; then
              xcrun xcresulttool export diagnostics --path delivery/Tests.xcresult --output-path delivery/test-diagnostics
            fi
          fi
          if test -d delivery/Brand-iPhone15.xcresult; then
            xcrun xcresulttool get test-results summary --path delivery/Brand-iPhone15.xcresult > delivery/brand-iphone15-summary.json
            xcrun xcresulttool export attachments --path delivery/Brand-iPhone15.xcresult --output-path delivery/brand-iphone15-screenshots
          fi
          for result in Baseline Reader-Large; do
            if test -d "delivery/$result.xcresult"; then
              xcrun xcresulttool get test-results summary --path "delivery/$result.xcresult" > "delivery/$result-summary.json"
              xcrun xcresulttool export attachments --path "delivery/$result.xcresult" --output-path "delivery/$result-screenshots"
            fi
          done
      - name: Package unsigned arm64 IPA
        if: ${{ !inputs.import_only && !inputs.reader_diagnostics }}
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/device/Build/Products/Release-iphoneos/QingRead.app"
          test -f "$app/QingRead"
          test ! -e "$app/_CodeSignature/CodeResources"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Info.plist")" = QingRead
          test -f "$app/NotoSerifSC.ttf"
          test -f "$app/Assets.car"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$app/Info.plist")" = 予盈
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")" = com.hdd290187.qingread
          test -d "$app/LaunchScreen.storyboardc"
          test "$GITHUB_RUN_NUMBER" -gt 24
          lipo -archs "$app/QingRead" | tee delivery/architectures.txt
          lipo -archs "$app/QingRead" | grep -qw arm64
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          ditto "$app" "$RUNNER_TEMP/ipa/Payload/QingRead.app"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$GITHUB_WORKSPACE/delivery/QingRead.ipa" Payload)
          unzip -t delivery/QingRead.ipa
          { printf 'brand=予盈\nbundle_id=com.hdd290187.qingread\nversion=1.0.0\nbuild=%s\nminimum_ios=17.0\nsigning=unsigned\n' "$GITHUB_RUN_NUMBER"; printf 'commit=%s\nrun=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID"; xcodebuild -version; } > delivery/build-info.txt
          (cd delivery && shasum -a 256 QingRead.ipa > SHA256SUMS)
      - name: Upload build, logs and test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: QingRead-ios-unsigned
          path: delivery/
          if-no-files-found: error
          retention-days: 30
