name: QingRead
options:
  deploymentTarget:
    iOS: '17.0'
  developmentLanguage: zh-Hans
packages:
  Readium:
    url: https://github.com/readium/swift-toolkit.git
    exactVersion: 3.11.1
  SwiftSoup:
    url: https://github.com/scinfu/SwiftSoup.git
    exactVersion: 2.13.5
targets:
  QingRead:
    type: application
    platform: iOS
    sources:
      - path: QingRead
        excludes: [Info.plist]
    dependencies:
      - package: Readium
        product: ReadiumShared
      - package: Readium
        product: ReadiumStreamer
      - package: Readium
        product: ReadiumNavigator
      - package: SwiftSoup
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hdd290187.qingread
        SWIFT_VERSION: '5.10'
        IPHONEOS_DEPLOYMENT_TARGET: '17.0'
        TARGETED_DEVICE_FAMILY: '1'
        SUPPORTS_MACCATALYST: NO
        CURRENT_PROJECT_VERSION: 45
        MARKETING_VERSION: 1.0.0
        INFOPLIST_FILE: QingRead/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGNING_ALLOWED: NO
  QingReadTests:
    type: bundle.unit-test
    platform: iOS
    sources: [QingReadTests]
    dependencies:
      - target: QingRead
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hdd290187.qingread.tests
        SWIFT_VERSION: '5.10'
        GENERATE_INFOPLIST_FILE: YES
  QingReadUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [QingReadUITests]
    dependencies:
      - target: QingRead
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hdd290187.qingread.uitests
        SWIFT_VERSION: '5.10'
        GENERATE_INFOPLIST_FILE: YES
schemes:
  QingRead:
    build:
      targets:
        QingRead: all
    test:
      targets: [QingReadTests, QingReadUITests]
      gatherCoverageData: true
